<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches --navy-950, the app shell. The pre-login sky screens are a
         different color on purpose; the browser chrome follows the shell. -->
    <meta name="theme-color" content="#0a1230" />
    <meta name="description" content="Chore Quest - daily chores, points, and rewards for the household." />
    <title>Chore Quest</title>

    <!-- Home-screen install. Paths are relative so one build works at both "/"
         in dev and "/ChoresApp/" on Pages. The service worker is Stage 14; this
         is what makes Add to Home Screen show the right name and icon today. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- iOS ignores the manifest for standalone mode and status-bar styling. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chore Quest" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
