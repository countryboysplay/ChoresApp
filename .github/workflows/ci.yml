name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # The schema tests skip themselves when there is no database, which would
    # quietly mean CI never checked a single constraint. This gives them one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chore_quest
          POSTGRES_PASSWORD: chore_quest
          POSTGRES_DB: chore_quest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chore_quest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://chore_quest:chore_quest@127.0.0.1:5432/chore_quest_test
      TEST_DATABASE_URL: postgres://chore_quest:chore_quest@127.0.0.1:5432/chore_quest_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the laptop, which is what actually runs this backend. CI was
          # on 22 while the machine serving the household ran 24 - so the runtime
          # differences that bite (the .cmd spawn change, date parsing) were
          # being tested on a version nobody uses.
          node-version: 24
          cache: npm

      # pg_dump refuses to talk to a server newer than itself, and the runner
      # ships a 16 client against the postgres:17 service. Without this the
      # backup tests skip and the one place backups are exercised automatically
      # is silently doing nothing.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Debian's pg_wrapper keeps resolving to the 16 client that is already
          # here, so the versioned binary goes on PATH by hand. Without this the
          # install "succeeds" and the tests still skip - a green CI proving
          # nothing, which is what happened the first time this was written.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Check pg_dump matches the server
        run: |
          pg_dump --version
          # Fail loudly rather than let the backup tests quietly skip themselves.
          pg_dump --version | grep -q ' 17\.' || {
            echo "pg_dump is not 17, so the backup tests would skip. Failing instead."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run migrations
        run: npm run db:migrate

      - name: Check migrations roll back cleanly
        # A down migration is only known to work the first time someone needs it
        # to, which is the worst moment to find out. Down to empty and back up.
        run: |
          npm run migrate:down -w backend -- 4
          npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Fail if secrets were committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(local|production)$|\.pem$'; then
            echo "Tracked secret file detected."
            exit 1
          fi
          echo "No tracked secret files."
