name: Deploy frontend preview

# Publishes the frontend to GitHub Pages so the UI can be reviewed on a phone
# without running anything locally. Stage 2 screens run on mock data, so no
# backend is required. The backend is never deployed here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same version as CI and the laptop, so the preview is built by the
          # toolchain everything else uses.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build -w frontend
        env:
          # Must match the repository name exactly - Pages paths are case-sensitive.
          VITE_BASE_PATH: /ChoresApp/
          # This build, and only this build, may fall back to mock profiles and
          # let navigation through when there is no API. It is set here rather
          # than inferred from a failed request because the app now caches its
          # shell: without the distinction, anyone who could make the API
          # unreachable would be inside a real household's app with no PIN.
          VITE_PREVIEW_MODE: 'true'

      - name: Add 404 fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
