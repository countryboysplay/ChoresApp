<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chore Quest phone</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d24; }
  body { display: grid; place-items: center; overflow: hidden; }
  .phone { width: 390px; height: 844px; padding: 12px; border-radius: 56px; background: #0b0c10;
    box-shadow: 0 0 0 2px #3a3d48, 0 30px 80px rgba(0,0,0,.6); position: relative; transform-origin: center; }
  /* The app scrolls inside a frame 15px wider (the Windows scrollbar) than the screen, so the desktop
     scrollbar sits outside the clipped area, as on a phone. */
  .screen { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; clip-path: inset(0 round 44px); }
  .screen iframe { display: block; width: 405px; height: 844px; border: 0; }
  .island { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 2; pointer-events: none; }
</style>
</head>
<body>
  <div class="phone" id="phone"><div class="island"></div><div class="screen"><iframe id="f" src="http://localhost:5180/#/child/home" title="Chore Quest"></iframe></div></div>
  <script>
    const fit = () => { const s = Math.min(1, (innerHeight - 24) / 868, (innerWidth - 24) / 414); document.getElementById('phone').style.transform = `scale(${s})`; };
    addEventListener('resize', fit); fit();
  </script>
</body>
</html>
